name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to publish (for example: v1.0.0)"
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate manual release tag input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "Manual releases require a semantic v* tag."; exit 1; }

      - name: Inspect requested release tag
        if: github.event_name == 'workflow_dispatch'
        id: release_tag
        shell: bash
        run: |
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            [[ "$TAG_COMMIT" == "$HEAD_COMMIT" ]] || { echo "Tag $RELEASE_TAG already exists on $TAG_COMMIT, but this run is building $HEAD_COMMIT."; exit 1; }
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test Electron app
        run: npm test

      - name: Build Windows executable
        run: npm run build

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch' && steps.release_tag.outputs.create_tag == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$RELEASE_TAG"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.exe
