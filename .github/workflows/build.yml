name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to publish (for example: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          [[ "$RELEASE_TAG" =~ ^v ]] || { echo "Manual releases require a v* tag."; exit 1; }
          git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1 || { echo "Tag $RELEASE_TAG does not exist."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test Electron app
        run: npm test

      - name: Build Windows executable
        run: npm run build

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          files: dist/*.exe
