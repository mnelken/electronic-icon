name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to publish (for example: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out repository for tag push
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate manual release tag input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "Manual releases require a semantic v* tag."; exit 1; }

      - name: Check out requested release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm checked out release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          CHECKED_OUT_TAG="$(git describe --tags --exact-match HEAD)"
          [[ "$CHECKED_OUT_TAG" == "$RELEASE_TAG" ]] || { echo "Checked out ref does not match $RELEASE_TAG."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test Electron app
        run: npm test

      - name: Build Windows executable
        run: npm run build

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.exe
